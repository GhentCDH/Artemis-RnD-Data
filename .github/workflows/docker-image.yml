name: Publish Docker image

# Builds the pipeline image and pushes it to GitHub Container Registry (GHCR)
# so it can be pulled remotely without building tippecanoe locally.

on:
  push:
    branches: [main, pipeline-v2]
    tags: ["v*"]
    paths:
      - "Dockerfile"
      - "package.json"
      - "bun.lock"
      - "src/**"
      - ".dockerignore"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/ghentcdh/artemis-data

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags/labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64          # pmtiles asset in Dockerfile is x86_64-only
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
