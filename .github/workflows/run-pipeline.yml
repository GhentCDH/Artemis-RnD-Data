name: Run data pipeline

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass incremental cache"
        required: false
        default: false
        type: boolean
      workers:
        description: "Pipeline worker count"
        required: true
        default: "4"
        type: choice
        options:
          - "4"
          - "8"

permissions:
  contents: write

concurrency:
  group: data-pipeline-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ghentcdh/artemis-data:pipeline-v2
  COMMAND: build
  ZENODO_RECORD: "21219182"
  TIMEOUT_MINUTES: "180"
  BUILD_STATE_BRANCH: GHCI-build-state
  OUTPUT_BRANCH: GHCI-testing

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull pipeline container
        run: docker pull "$IMAGE"

      - name: Cache Zenodo source mirror
        uses: actions/cache@v4
        with:
          path: .build-cache/zenodo-source
          key: zenodo-source-${{ env.ZENODO_RECORD }}

      - name: Cache Bun dependencies and pipeline cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            .build-cache/allmaps
            .build-cache/iiif
            .build-cache/image-collections
            .build-cache/warp-tif
          key: pipeline-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ env.ZENODO_RECORD }}
          restore-keys: |
            pipeline-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            pipeline-${{ runner.os }}-

      - name: Restore build state
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --heads origin "$BUILD_STATE_BRANCH" >/dev/null 2>&1; then
            tmpdir="$(mktemp -d)"
            git fetch --depth=1 origin "$BUILD_STATE_BRANCH"
            git archive "origin/$BUILD_STATE_BRANCH" build 2>/dev/null | tar -x -C "$tmpdir" || true
            if [ -d "$tmpdir/build" ]; then
              rm -rf build
              cp -a "$tmpdir/build" ./build
              echo "Restored build state from $BUILD_STATE_BRANCH."
            else
              echo "$BUILD_STATE_BRANCH has no build/ directory yet."
            fi
          else
            echo "No $BUILD_STATE_BRANCH branch yet; starting without restored build state."
          fi

      - name: Run selected pipeline command
        env:
          FORCE: ${{ inputs.force }}
          BUILD_CONCURRENCY: ${{ inputs.workers }}
        run: |
          set -euo pipefail

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --entrypoint bash \
            -v "$PWD:/app" \
            -w /app \
            -e COMMAND \
            -e ZENODO_RECORD \
            -e FORCE \
            -e TIMEOUT_MINUTES \
            -e BUILD_CONCURRENCY \
            "$IMAGE" \
            -lc '
              set -euo pipefail

              TMPDIR=/tmp bun install --frozen-lockfile

              cmd=(bun run src/cli.ts "$COMMAND" "$ZENODO_RECORD")

              if [ "$FORCE" = "true" ]; then
                cmd+=(--force)
              fi

              echo "Running with timeout ${TIMEOUT_MINUTES}m:"
              printf "  %q" "${cmd[@]}"
              echo

              timeout --preserve-status "${TIMEOUT_MINUTES}m" "${cmd[@]}"
            '

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-build-${{ github.run_id }}
          path: |
            build/Build.log
            build/IIIFWarnings.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish build outputs
        if: ${{ success() }}
        run: |
          set -euo pipefail

          if [ ! -d build ]; then
            echo "No build/ directory produced; nothing to publish."
            exit 0
          fi

          output_dir="$(mktemp -d)"
          cp -a build "$output_dir/build"
          rm -rf "$output_dir/build/.tmp"
          if [ -d static ]; then cp -a static "$output_dir/static"; fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git reset --hard -q HEAD

          publish_branch() {
            local branch="$1"
            local label="$2"
            local include_static="$3"

            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git checkout -q -B "$branch" "origin/$branch"
            else
              git checkout -q --orphan "$branch"
            fi

            git rm -r -q . 2>/dev/null || true
            find . -mindepth 1 -maxdepth 1 \
              ! -name .git \
              ! -name .build-cache \
              ! -name node_modules \
              -exec rm -rf {} +

            cp -a "$output_dir/build" ./build
            git add build

            if [ "$include_static" = "true" ] && [ -d "$output_dir/static" ]; then
              cp -a "$output_dir/static" ./static
              git add static
            fi

            if git diff --cached --quiet; then
              echo "No $label changes to publish."
              return
            fi

            git commit --quiet -m "ci: update pipeline $label ($GITHUB_RUN_ID)"
            git push --quiet origin "$branch"
            echo "Published $label to $branch."
          }

          publish_branch "$BUILD_STATE_BRANCH" "build state" "false"
          publish_branch "$OUTPUT_BRANCH" "build output" "true"
