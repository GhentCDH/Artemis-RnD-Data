name: Run data pipeline
run-name: "Zenodo record ${{ inputs.zenodo_record }}${{ inputs.force && ' · force' || '' }}${{ inputs.publish_live && ' · publish live' || '' }} (${{ github.actor }})"

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass incremental cache"
        required: false
        default: false
        type: boolean
      zenodo_record:
        description: "Zenodo record/draft ID"
        required: true
        default: "21219182"
        type: string
      publish_live:
        description: "Force publish draft to live"
        required: false
        default: false
        type: boolean
      no_raster:
        description: "Skip raster warp + XYZ tiles"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write   # lets "gh cache delete" replace the Zenodo source mirror cache in place (see below)

concurrency:
  group: data-pipeline-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ghentcdh/artemis-data:pipeline-v2
  COMMAND: build
  ZENODO_RECORD: ${{ inputs.zenodo_record }}
  TIMEOUT_MINUTES: "180"
  BUILD_STATE_BRANCH: build-cache

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pull pipeline container
        run: docker pull "$IMAGE"

      # One rolling slot, not one entry per record: the record id changes on
      # almost every run (every draft tested), and cache entries are immutable
      # per key, so a record-scoped key would recreate a new ~150-200MB cache
      # every time instead of reusing one. Safe to restore unconditionally,
      # including for drafts, since the pipeline re-fetches the record's file
      # listing every run and only reuses the cached zip if its checksum still
      # matches - so a stale or mismatched restore is never served as-is.
      - name: Restore Zenodo source mirror cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: .build-cache/zenodo-source
          key: zenodo-source-${{ runner.os }}

      # Not record-scoped: this holds IIIF/allmaps/sprite/warp caches that are
      # keyed internally by their own content hashes (canvas id, warp
      # signature, etc.), not by which Zenodo record triggered the build - so
      # it's meant to be shared and grow across every record ever built, not
      # duplicated per record. (It previously included the record id in the
      # key, which created a brand new ~500MB cache per Zenodo draft tested
      # instead of reusing/growing one shared cache - see repo cache list.)
      - name: Cache Bun dependencies and pipeline cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            node_modules
            .build-cache/allmaps
            .build-cache/iiif
            .build-cache/image-collections
            .build-cache/warp-tif
          key: pipeline-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            pipeline-${{ runner.os }}-

      - name: Restore build state
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --heads origin "$BUILD_STATE_BRANCH" >/dev/null 2>&1; then
            tmpdir="$(mktemp -d)"
            git fetch --depth=1 origin "$BUILD_STATE_BRANCH"
            git archive "origin/$BUILD_STATE_BRANCH" build 2>/dev/null | tar -x -C "$tmpdir" || true
            if [ -d "$tmpdir/build" ]; then
              rm -rf build
              cp -a "$tmpdir/build" ./build
              echo "Restored build state from $BUILD_STATE_BRANCH."
            else
              echo "$BUILD_STATE_BRANCH has no build/ directory yet."
            fi
          else
            echo "No $BUILD_STATE_BRANCH branch yet; starting without restored build state."
          fi

      - name: Run selected pipeline command
        id: run_pipeline
        env:
          FORCE: ${{ inputs.force }}
          PUBLISH_LIVE: ${{ inputs.publish_live }}
          NO_RASTER: ${{ inputs.no_raster }}
          BUILD_CONCURRENCY: "8"
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          set -uo pipefail

          # GitHub Actions invokes this whole script as `bash -e ...` before
          # any line of the script itself runs, so a bare `set -uo pipefail`
          # here does NOT turn that inherited -e off - a plain nonzero exit
          # from docker run would still kill the script immediately, before
          # `rc=$?` or the exit-code-2 handling below ever executed. Running
          # it as an `if` condition is what actually exempts it from -e.
          if docker run --rm \
            --user "$(id -u):$(id -g)" \
            --entrypoint bash \
            -v "$PWD:/app" \
            -w /app \
            -e COMMAND \
            -e ZENODO_RECORD \
            -e ZENODO_TOKEN \
            -e FORCE \
            -e PUBLISH_LIVE \
            -e NO_RASTER \
            -e TIMEOUT_MINUTES \
            -e BUILD_CONCURRENCY \
            "$IMAGE" \
            -lc '
              set -euo pipefail

              TMPDIR=/tmp bun install --frozen-lockfile

              cmd=(bun run src/cli.ts "$COMMAND" "$ZENODO_RECORD")

              if [ "$FORCE" = "true" ]; then
                cmd+=(--force)
              fi

              if [ "$PUBLISH_LIVE" = "true" ]; then
                cmd+=(--publish-live)
              fi

              if [ "$NO_RASTER" = "true" ]; then
                cmd+=(--no-raster)
              fi

              echo "Running with timeout ${TIMEOUT_MINUTES}m:"
              printf "  %q" "${cmd[@]}"
              echo

              timeout --preserve-status "${TIMEOUT_MINUTES}m" "${cmd[@]}"
            '
          then
            rc=0
          else
            rc=$?
          fi

          # Exit code 2 means the pipeline itself ran fine but found unresolved
          # content issues (missing downloads/logos/empty sublayers) and
          # deliberately refused to publish - not a pipeline crash. Surface
          # that distinction so the job can stay green while still skipping
          # publish, instead of reporting a red failure for expected content
          # gaps (e.g. an intentionally-empty sublayer used to test this gate).
          if [ "$rc" -eq 2 ]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=Build blocked::Pipeline completed but found unresolved content issues; publish was skipped. See the job summary for details."
            exit 0
          fi

          echo "blocked=false" >> "$GITHUB_OUTPUT"
          exit "$rc"

      # Cache entries are immutable per key, so keeping this a single rolling
      # slot means explicitly deleting the previous one before saving the new
      # state - otherwise every run after the first would just silently skip
      # saving (key already exists) and the cache would freeze at whatever the
      # very first run downloaded.
      - name: Save Zenodo source mirror cache
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh cache delete "zenodo-source-${{ runner.os }}" --repo "${{ github.repository }}" || true

      - uses: actions/cache/save@v6.1.0
        if: always()
        with:
          path: .build-cache/zenodo-source
          key: zenodo-source-${{ runner.os }}

      # The pipeline auto-detects draft-vs-published straight from the record
      # id (Zenodo's public API 404s for anything not published) and writes
      # the result to build/ZenodoSource.json; this step just reads it back
      # so later steps can route to the draft/live branch without
      # re-implementing that detection.
      - name: Determine publish target
        id: zenodo_source
        if: ${{ success() }}
        run: |
          set -euo pipefail

          if [ ! -s build/ZenodoSource.json ]; then
            echo "build/ZenodoSource.json not found; the pipeline should always write it." >&2
            exit 1
          fi

          is_draft="$(jq -r '.isDraft' build/ZenodoSource.json)"
          record_id="$(jq -r '.recordId' build/ZenodoSource.json)"
          download_resolution="$(jq -r '.downloadResolution // "source"' build/ZenodoSource.json)"
          branch="live"
          if [ "$is_draft" = "true" ] && [ "${{ inputs.publish_live }}" != "true" ]; then
            branch="draft"
          fi

          echo "is_draft=$is_draft" >> "$GITHUB_OUTPUT"
          echo "record_id=$record_id" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "download_resolution=$download_resolution" >> "$GITHUB_OUTPUT"

          echo "Zenodo record $record_id is $([ "$is_draft" = "true" ] && echo "an unpublished draft" || echo "published") -> publishing to '$branch' (downloads: $download_resolution)."

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-logs-build-${{ github.run_id }}
          path: |
            build/Build.log
            build/IIIFWarnings.log
            build/BuildIssues.log
            build/DownloadReminders.log
            build/Sublayers.md
          if-no-files-found: ignore
          retention-days: 14

      - name: Surface pipeline warnings
        if: always()
        env:
          BUILD_FROM_DRAFT: ${{ steps.zenodo_source.outputs.is_draft }}
          DOWNLOAD_RESOLUTION: ${{ steps.zenodo_source.outputs.download_resolution }}
        run: |
          set -euo pipefail

          if [ -s build/BuildIssues.log ]; then
            issues_count="$(grep -c '^- ' build/BuildIssues.log || true)"
            echo "::error title=Build issues::Pipeline found $issues_count unresolved reference(s) (missing sublayer downloads / unknown logos / empty sublayers) that block publishing. See the job summary or uploaded logs artifact."
          fi

          if [ "$BUILD_FROM_DRAFT" = "true" ] && [ "$DOWNLOAD_RESOLUTION" = "latest-published-fallback" ]; then
            echo "::warning title=Draft Zenodo source, publishing live::Sublayer downloads were resolved against the latest published version instead of this draft — double-check they still make sense for this draft's content."
          elif [ "$BUILD_FROM_DRAFT" = "true" ]; then
            echo "::warning title=Draft Zenodo source::Sublayer downloads won't work — the Zenodo record has not been published."
          fi

          if [ -s build/IIIFWarnings.log ]; then
            line_count="$(wc -l < build/IIIFWarnings.log | tr -d ' ')"
            echo "::warning title=IIIF warnings (non-blocking)::Pipeline produced IIIF warnings ($line_count log lines). Georeferencing quality notes only; does not block publishing."
          fi

          {
            echo "## Build issues"
            echo
            if [ -s build/BuildIssues.log ]; then
              echo "> **✗ Publish skipped.** The pipeline itself ran fine (this workflow run is not marked failed); it just found unresolved content problems and deliberately declined to publish. $issues_count unresolved reference(s) below must be fixed before this can publish."
              echo
              grep '^- ' build/BuildIssues.log
            else
              echo "✓ No blocking issues."
            fi
            echo
            if [ "$BUILD_FROM_DRAFT" = "true" ] && [ "$DOWNLOAD_RESOLUTION" = "latest-published-fallback" ]; then
              echo "> **Draft source, published to live anyway.** This build read \`Source.zip\` from an unpublished Zenodo draft, but \`--publish-live\` was set, so per-sublayer \`download\` links were resolved against this record's **latest published version** instead of the draft itself — verify they still match this draft's content before trusting them."
              echo
            elif [ "$BUILD_FROM_DRAFT" = "true" ]; then
              echo "> **Draft source: sublayer downloads won't work.** This build read \`Source.zip\` from an unpublished Zenodo draft. Draft files require authenticated access, so per-sublayer \`download\` links cannot be resolved to public URLs until this record is published. This does not block publishing to the \`draft\` branch."
              echo
            fi

            echo "## Sublayers without a download (non-blocking)"
            echo
            if [ -s build/DownloadReminders.log ]; then
              echo "These sublayers built real content but have no \`download:\` configured yet — not an error, just a reminder in case one should be added."
              echo
              grep '^- ' build/DownloadReminders.log
            else
              echo "✓ Every built sublayer has a download configured (or doesn't need one)."
            fi
            echo

            echo "## Sublayers built"
            echo
            if [ -s build/Sublayers.md ]; then
              cat build/Sublayers.md
            else
              echo "_No sublayer summary produced._"
            fi
            echo

            echo "## Pipeline logs (non-blocking)"
            echo
            if [ -s build/IIIFWarnings.log ]; then
              echo "### IIIF warnings"
              echo
              echo "\`build/IIIFWarnings.log\` contains $line_count lines. Georeferencing quality notes only — informational, does not block publishing."
              echo
              echo "<details><summary>First 200 lines</summary>"
              echo
              echo '```text'
              sed -n '1,200p' build/IIIFWarnings.log
              if [ "$line_count" -gt 200 ]; then
                echo
                echo "... truncated; download the logs artifact for the full file."
              fi
              echo '```'
              echo "</details>"
            else
              echo "No IIIF warning log produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish build outputs
        id: publish
        if: ${{ success() && steps.run_pipeline.outputs.blocked != 'true' }}
        env:
          OUTPUT_BRANCH: ${{ steps.zenodo_source.outputs.branch }}
        run: |
          set -euo pipefail

          if [ ! -d build ]; then
            echo "No build/ directory produced; nothing to publish."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          output_dir="$(mktemp -d)"
          cp -a build "$output_dir/build"
          rm -rf "$output_dir/build/.tmp"
          if [ -d static ]; then cp -a static "$output_dir/static"; fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git reset --hard -q HEAD
          rm -rf build static

          publish_branch() {
            local branch="$1"
            local label="$2"
            local include_static="$3"

            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git checkout -q -B "$branch" "origin/$branch"
            else
              git checkout -q --orphan "$branch"
            fi

            git rm -r -q . 2>/dev/null || true
            find . -mindepth 1 -maxdepth 1 \
              ! -name .git \
              ! -name .build-cache \
              ! -name node_modules \
              -exec rm -rf {} +

            cp -a "$output_dir/build" ./build
            git add build

            if [ "$include_static" = "true" ] && [ -d "$output_dir/static" ]; then
              cp -a "$output_dir/static" ./static
              git add static
            fi

            if git diff --cached --quiet; then
              echo "No $label changes to publish."
              return
            fi

            git commit --quiet -m "ci: update pipeline $label ($GITHUB_RUN_ID)"
            git push --quiet origin "$branch"
            echo "Published $label to $branch."
          }

          publish_branch "$BUILD_STATE_BRANCH" "build state" "false"
          publish_branch "$OUTPUT_BRANCH" "build output" "true"

          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Tag build
        if: ${{ success() && steps.publish.outputs.published == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZENODO_RECORD: ${{ inputs.zenodo_record }}
          BUILD_FROM_DRAFT: ${{ steps.zenodo_source.outputs.is_draft }}
          DOWNLOAD_RESOLUTION: ${{ steps.zenodo_source.outputs.download_resolution }}
          PUBLISH_BRANCH: ${{ steps.zenodo_source.outputs.branch }}
          COMMIT_SHA: ${{ steps.publish.outputs.commit }}
        run: |
          set -euo pipefail

          # Tag/title reflect source draft-ness (was Source.zip read from an
          # unpublished draft?), independent of which branch the build was
          # published to.
          TAG="zenodo-$ZENODO_RECORD"
          TITLE="Zenodo record $ZENODO_RECORD"
          NOTES_SUFFIX=""
          if [ "$BUILD_FROM_DRAFT" = "true" ] && [ "$DOWNLOAD_RESOLUTION" = "latest-published-fallback" ]; then
            TAG="${TAG}-draft"
            TITLE="Zenodo draft $ZENODO_RECORD"
            NOTES_SUFFIX="

          Built from an **unpublished Zenodo draft**, published to \`live\` anyway. Sublayer download links were resolved against this record's **latest published version** instead of the draft itself — verify they still match this draft's content."
          elif [ "$BUILD_FROM_DRAFT" = "true" ]; then
            TAG="${TAG}-draft"
            TITLE="Zenodo draft $ZENODO_RECORD"
            NOTES_SUFFIX="

          Built from an **unpublished Zenodo draft**. Sublayer download links will not work until this record is published — draft files require authenticated access, so they cannot be resolved to public download URLs."
          fi

          SUBLAYERS_NOTE=""
          if [ -s build/Sublayers.md ]; then
            SUBLAYERS_NOTE="

          ## Sublayers built

          $(cat build/Sublayers.md)"
          fi

          if [ "$PUBLISH_BRANCH" = "live" ]; then
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG already exists; replacing it to point at the latest build."
              gh release delete "$TAG" --yes --cleanup-tag
            fi

            NOTES="Automated data-pipeline build from [Zenodo record $ZENODO_RECORD](https://zenodo.org/records/$ZENODO_RECORD).

          Published to \`$PUBLISH_BRANCH\` @ \`$COMMIT_SHA\`.$NOTES_SUFFIX

          The **Source code (zip)**/**(tar.gz)** assets below are GitHub's automatic archive of this tag and are, in this case, this build's data — the \`build/\` (and \`static/\`) output as of \`$COMMIT_SHA\`, not the pipeline source code.$SUBLAYERS_NOTE"

            gh release create "$TAG" \
              --target "$COMMIT_SHA" \
              --title "$TITLE" \
              --notes "$NOTES"
          else
            # Non-live publish target: traceable tag on the branch, no public Release.
            git tag -f "$TAG" "$COMMIT_SHA"
            git push --force origin "refs/tags/$TAG"
            echo "Tagged $COMMIT_SHA as $TAG (pushed to $PUBLISH_BRANCH; no GitHub Release created)."
          fi
