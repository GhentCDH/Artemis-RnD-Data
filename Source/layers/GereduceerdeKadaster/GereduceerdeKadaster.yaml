id: GereduceerdeKadaster
label: Gereduceerd kadaster
timeframe:
  startYear: 1847
  endYear: 1855

sublayers:
  - id: GereduceerdeKadaster-iiif
    name: IIIF collection
    kind: iiif
    source:
      type: remote
      # NOTE: currently a prototyping URL on a personal repo — replace with the
      # production hosted collection before release.
      url: "https://raw.githubusercontent.com/RDebrulle/AllmapsTests/refs/heads/main/Gereduceerd_Kadaster.json"
    description: |
      De gereduceerde kadasterplannen zijn een reeks van ca. 2.500 plannen van
      Belgische gemeenten, opgesteld tussen 1847 en 1855 door het Krijgsdepot (de
      voorloper van het NGI). De perceelsplannen van het primitief kadaster
      werden samengevoegd en verkleind tot schaal 1:20.000 en aangevuld met
      topografische elementen (reliëf, wegen, waterlopen). Ze dienden als
      topografische basis voor de eerste officiële stafkaarten van België.
      Beschikbaar via de NGI-webshop en cartesius.be.
    attribution:
      credit: "Nationaal Geografisch Instituut (NGI)"
      logos: [logo_NGI.png]
      rights: https://www.ngi.be/website/gebruiksvoorwaarden/
    citation:
      authors: ["Krijgsdepot / Nationaal Geografisch Instituut (NGI)"]
      title: "Gereduceerd kadaster (1:20.000)"
      year: 1851
      publisher: "Nationaal Geografisch Instituut (NGI)"
      url: https://www.cartesius.be

  - id: GereduceerdeKadaster-parcels
    name: Parcels
    kind: geojson
    source:
      type: planned   # TODO
    description: |
      Gevectoriseerde perceelsgrenzen afgeleid van de gereduceerde
      kadasterplannen.

  - id: GereduceerdeKadaster-toponyms
    name: Toponyms
    kind: searchable
    source:
      type: generated
      rawInput: toponyms/GereduceerdeKadaster_toponyms.geojson   # WHG LPF → GeoJSON (3548 places)
    description: |
      Historische toponiemen zoals ze voorkomen op het gereduceerd kadaster van
      België (1847–1855) voor de provincies Antwerpen en Oost-Vlaanderen.
      Doorzoekbaar en als labels op de kaart weer te geven. Afkomstig uit de
      Belgian Historical Gazetteer (World Historical Gazetteer, dataset 1756);
      wordt later uitgebreid naar de overige Belgische provincies.
    attribution:
      credit: "Belgian Historical Gazetteer Project & L. Hermenault — World Historical Gazetteer"
      logos: [Logo_UAntw.jpg]
      rights: https://creativecommons.org/licenses/by-nc/4.0/
    citation:
      authors: ["Belgian Historical Gazetteer Project", "Hermenault, Léa"]
      title: "Belgian Historical Gazetteer — Provinces Antwerp and East-Flanders"
      year: 2026
      publisher: "World Historical Gazetteer"
      url: https://www.uantwerpen.be/en/projects/belgian-historical-gazetteer/
      text: >
        Project, B. H. G., & Hermenault, L. (2026). Belgian Historical Gazetteer
        - Provinces Antwerp and East-Flanders [Data set]. World Historical
        Gazetteer. https://www.uantwerpen.be/en/projects/belgian-historical-gazetteer/

  - id: GereduceerdeKadaster-landusage
    name: Land usage
    kind: geojson
    source:
      type: planned   # TODO
    description: |
      Historisch landgebruik afgeleid van het gereduceerd kadaster.
