id: HanddrawnCollection
label: Hand drawn collection
timeframe:
  label: "19th c."

sublayers:
  - id: HanddrawnCollection-iiif
    name: IIIF collection
    kind: iiif
    source:
      type: planned   # TODO: no IIIF collection URL yet
    description: |
      Een verzameling van met de hand getekende historische kaarten, afkomstig
      uit de collecties van instellingen zoals het Nationaal Geografisch
      Instituut (NGI), de Koninklijke Bibliotheek van België (KBR) en het
      Rijksarchief. Al deze stukken zijn gescand en raadpleegbaar via
      cartesius.be, het geoportaal voor cartografisch erfgoed en historische
      luchtfoto's van België.
    attribution:
      credit: "NGI · KBR · Rijksarchief België — via cartesius.be"
      logos: [logo_NGI.png, logo_KRB.png, logo_Rijksarchief.png]
      rights: https://www.cartesius.be

  - id: HanddrawnCollection-parcels
    name: Parcels
    kind: geojson
    source:
      type: planned   # TODO
    description: |
      Gevectoriseerde perceelsgrenzen afgeleid van de handgetekende kaarten,
      waar de brontekening dit toelaat.

  - id: HanddrawnCollection-water
    name: Water infrastructure
    kind: geojson
    source:
      type: planned   # TODO
    description: |
      Waterinfrastructuur (grachten, dijken, sluizen, waterlopen)
      getranscribeerd uit de handgetekende kaarten.
