id: NGI1873
label: NGI Basemap 1873
timeframe:
  startYear: 1873
  endYear: 1880

sublayers:
  - id: NGI1873-wmts
    name: Map
    kind: wmts
    source:
      type: remote
      url: "https://wmts.ngi.be/arcgis/rest/services/seamless_carto__default__3857__140/MapServer/tile/{z}/{y}/{x}"
    description: |
      Topografische basiskaart van België uit 1873, opgesteld door het
      Krijgsdepot (de vroegste voorganger van het NGI). Eerdere kaarten zoals
      deze werden aan de hand van veldopmetingen vervaardigd. De kaart geeft een
      uniek beeld van het pre-industriële Belgische landschap in de tweede helft
      van de 19e eeuw. Beschikbaar via cartesius.be.
    attribution:
      credit: "Nationaal Geografisch Instituut (NGI)"
      logos: [logo_NGI.png]
      rights: https://www.ngi.be/website/gebruiksvoorwaarden/
    citation:
      authors: ["Krijgsdepot / Nationaal Geografisch Instituut (NGI)"]
      title: "Topografische basiskaart van België, 1873"
      year: 1873
      publisher: "Nationaal Geografisch Instituut (NGI)"
      url: https://www.cartesius.be
