id: Vandermaelen
label: Vandermaelen
timeframe:
  startYear: 1846
  endYear: 1854

sublayers:
  - id: Vandermaelen-wmts
    name: Map
    kind: wmts
    source:
      type: remote
      url: "https://geo.api.vlaanderen.be/HISTCART/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=vandermaelen&STYLE=&FORMAT=image/png&TILEMATRIXSET=GoogleMapsVL&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}"
    description: |
      De Cartes topographiques de la Belgique van Philippe Vandermaelen
      (1795–1869), oprichter van het Établissement géographique de Bruxelles.
      Hij publiceerde 250 kaartbladen op schaal 1:20.000 (1846–1854); de kaart
      geldt als de opvolger van de Ferrariskaart en verscheen lang vóór de
      officiële stafkaarten van het Krijgsdepot. Bij de sluiting van het
      Établissement in 1880 verwierf de KBR de volledige collectie. Digitaal
      beschikbaar via geopunt.be.
    attribution:
      credit: "Koninklijke Bibliotheek van België (KBR) — via geopunt.be (Digitaal Vlaanderen)"
      logos: [logo_KRB.png]
      rights: https://www.geopunt.be/gebruiksvoorwaarden
    citation:
      authors: ["Vandermaelen, Philippe"]
      title: "Cartes topographiques de la Belgique (1:20.000)"
      year: 1850
      publisher: "Koninklijke Bibliotheek van België (KBR)"
      url: https://www.geopunt.be

  - id: Vandermaelen-landusage
    name: Land usage
    kind: wms
    source:
      type: remote
      url: "https://geo.api.vlaanderen.be/inbo/wms?SERVICE=WMS&REQUEST=GetMap&VERSION=1.3.0&LAYERS=B1850&STYLES=&FORMAT=image%2Fpng&TRANSPARENT=TRUE&CRS=EPSG%3A3857&BBOX={bbox-epsg-3857}&WIDTH=256&HEIGHT=256"
    description: |
      Gereconstrueerd historisch landgebruik omstreeks 1850, afgeleid door het
      Instituut voor Natuur- en Bosonderzoek (INBO). Een gekleurde indexlaag die
      het landgebruik van het midden van de 19e eeuw classificeert.
    attribution:
      credit: "Instituut voor Natuur- en Bosonderzoek (INBO)"
      logos: []   # add `inbo` once the logo asset exists
      rights: https://www.geopunt.be/gebruiksvoorwaarden
    citation:
      authors: ["Instituut voor Natuur- en Bosonderzoek (INBO)"]
      title: "Historisch landgebruik ca. 1850 (B1850)"
      publisher: "INBO"
      url: https://www.vlaanderen.be/inbo

  - id: Vandermaelen-toponyms
    name: Toponyms
    kind: searchable
    source:
      type: planned   # TODO
    description: |
      Toponiemen getranscribeerd uit de Vandermaelenkaart, doorzoekbaar en als
      labels op de kaart weer te geven.
