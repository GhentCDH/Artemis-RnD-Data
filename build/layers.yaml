          en: |-
            The Cartes topographiques de la Belgique by Philippe Vandermaelen (1795–1869),
            founder of the Établissement géographique de Bruxelles. He published 250 map
            sheets at a scale of 1:20,000 between 1846 and 1854; the map is considered the
            successor to the Ferraris map and appeared long before the official military
            maps of the War Depot. When the Établissement closed in 1880, KBR acquired the
            complete collection. Available digitally via geopunt.be.
        sources:
