  - id: Ferraris
    label: Ferraris
    timeframe:
      startYear: 1771
      endYear: 1778
    sublayers:
      - id: Ferraris-wmts
        name:
          nl: Kaart
          en: Map
        kind: wmts
        source:
          type: remote
          url: https://geo.api.vlaanderen.be/HISTCART/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=ferraris&STYLE=&FORMAT=image/png&TILEMATRIXSET=GoogleMapsVL&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}
        description:
          nl: |-
            De Kabinetskaart der Oostenrijkse Nederlanden en het Prinsbisdom Luik,
            opgesteld tussen 1771 en 1778 in opdracht van keizerin Maria Theresia en
            keizer Jozef II, onder leiding van generaal Joseph-Jean-François graaf de
            Ferraris (1726–1814). Met 275 handgetekende en ingekleurde kaartbladen op
            schaal 1:11.520 is dit de eerste systematische en grootschalige topografische
            kartering van wat nu België is. Het KBR-exemplaar in Brussel is
            gedigitaliseerd en via geopunt.be raadpleegbaar.
          en: |-
            The Cabinet Map of the Austrian Netherlands and the Prince-Bishopric of Liège
            was produced between 1771 and 1778 by order of Empress Maria Theresa and
            Emperor Joseph II, under the direction of General Joseph-Jean-François, Count
            de Ferraris (1726–1814). Comprising 275 hand-drawn and coloured map sheets at
            a scale of 1:11,520, it is the first systematic, large-scale topographic
            survey of present-day Belgium. The KBR copy in Brussels has been digitised and
            can be consulted via geopunt.be.
        sources:
          - citation: de Ferraris, J.-J.-F. (1777). Kabinetskaart der Oostenrijkse Nederlanden en het Prinsbisdom Luik [Map]. Koninklijke Bibliotheek van België (KBR). https://www.geopunt.be
            url: https://geo.api.vlaanderen.be/HISTCART/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=ferraris&STYLE=&FORMAT=image/png&TILEMATRIXSET=GoogleMapsVL&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}
      - id: Ferraris-landusage
        name:
          nl: Landgebruik
          en: Land use
        kind: wms
        source:
          type: remote
          url: https://geo.api.vlaanderen.be/INBO/wms?SERVICE=WMS&REQUEST=GetMap&VERSION=1.3.0&LAYERS=Lgbrk1778&STYLES=&FORMAT=image%2Fpng&TRANSPARENT=TRUE&CRS=EPSG%3A3857&BBOX={bbox-epsg-3857}&WIDTH=256&HEIGHT=256
        description:
          nl: |-
            Gereconstrueerd historisch landgebruik omstreeks 1778, afgeleid van de
            Ferrariskaart door het Instituut voor Natuur- en Bosonderzoek (INBO). Een
            gekleurde indexlaag die het pre-industriële landgebruik (akker, bos, grasland,
            bebouwing, water) classificeert.
          en: |-
            Reconstructed historical land use around 1778, derived from the Ferraris map
            by the Research Institute for Nature and Forest (INBO). A coloured index layer
            classifying pre-industrial land use (arable land, woodland, grassland,
            built-up areas and water).
        sources:
          - citation: Instituut voor Natuur- en Bosonderzoek (INBO). (n.d.). Historisch landgebruik naar de Ferrariskaart (Lgbrk1778) [Data set]. INBO. https://www.vlaanderen.be/inbo
            url: https://geo.api.vlaanderen.be/INBO/wms?SERVICE=WMS&REQUEST=GetMap&VERSION=1.3.0&LAYERS=Lgbrk1778&STYLES=&FORMAT=image%2Fpng&TRANSPARENT=TRUE&CRS=EPSG%3A3857&BBOX={bbox-epsg-3857}&WIDTH=256&HEIGHT=256
      - id: Ferraris-toponyms
        name:
          nl: Toponiemen
          en: Toponyms
        kind: searchable
        description:
          nl: |-
            Toponiemen (plaatsnamen, veldnamen, waternamen) getranscribeerd uit de
            Ferrariskaart, doorzoekbaar en als labels op de kaart weer te geven.
          en: |-
