        description:
          nl: |-
            De Carte des Pays-Bas et des frontières de France van Eugène-Henri Fricx
            (1644–1730), Brusselse boekhandelaar en drukker. De eerste editie verscheen in
            1712, toen 23 van de 24 topografische kaartbladen van de Zuidelijke
            Nederlanden klaar waren; het 24e blad (Luxemburg) volgde pas in 1727. De
            digitale ontsluiting voor Vlaanderen kwam tot stand via KBR en AGIV (nu
            Digitaal Vlaanderen). Raadpleegbaar via geopunt.be.
          en: |-
            The Carte des Pays-Bas et des frontières de France by Eugène-Henri Fricx
            (1644–1730), a Brussels bookseller and printer. The first edition appeared in
            1712, when 23 of the 24 topographic map sheets of the Southern Netherlands had
            been completed; the 24th sheet (Luxembourg) followed only in 1727. Digital
            access for Flanders was created through KBR and AGIV (now Digital Flanders).
            Available via geopunt.be.
        sources:
          - citation: Fricx, E.-H. (1712). Carte des Pays-Bas et des frontières de France [Map]. Koninklijke Bibliotheek van België (KBR). https://www.geopunt.be
            url: https://geo.api.vlaanderen.be/HISTCART/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=frickx&STYLE=&FORMAT=image/png&TILEMATRIXSET=GoogleMapsVL&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}
  - id: GereduceerdeKadaster
    label: Gereduceerd kadaster
    timeframe:
      startYear: 1847
      endYear: 1855
    sublayers:
      - id: GereduceerdeKadaster-iiif
        name:
          nl: Kaart
          en: Map
        kind: iiif
        description:
          nl: |-
            De gereduceerde kadasterplannen zijn een reeks van ca. 2.500 plannen van
            Belgische gemeenten, opgesteld tussen 1847 en 1855 door het Krijgsdepot (de
            voorloper van het NGI). De perceelsplannen van het primitief kadaster werden
            samengevoegd en verkleind tot schaal 1:20.000 en aangevuld met topografische
            elementen (reliëf, wegen, waterlopen). Ze dienden als topografische basis voor
            de eerste officiële stafkaarten van België. Beschikbaar via de NGI-webshop en
            cartesius.be.
          en: |-
            The reduced cadastral plans are a series of approximately 2,500 plans of
            Belgian municipalities, produced between 1847 and 1855 by the War Depot (the
            predecessor of the NGI). The parcel plans of the primitive cadastre were
            combined and reduced to a scale of 1:20,000, then supplemented with
            topographic features such as relief, roads and waterways. They served as the
            topographic basis for Belgium’s first official military maps. Available
            through the NGI web shop and cartesius.be.
        sources:
          - citation: Krijgsdepot / Nationaal Geografisch Instituut (NGI). (1851). Gereduceerd kadaster (1:20.000) [Map]. Nationaal Geografisch Instituut (NGI). https://www.cartesius.be
            url: https://raw.githubusercontent.com/RDebrulle/AllmapsTests/refs/heads/main/Gereduceerd_Kadaster.json
          - citation: "Ghent Centre for Digital Humanities. (2026). Gereduceerd kadaster: Georeferenced cadastral map-sheet masks [Data set]. Derived from the reduced cadastral plans of the National Geographic Institute of Belgium."
            url: https://zenodo.org/api/records/21256920/files/Gereduceerd_Kadaster_Masks.zip/content
        artifacts:
          geomaps: Layers/GereduceerdeKadaster/geomaps.json
          search: Layers/GereduceerdeKadaster/search.json
          raster: Layers/GereduceerdeKadaster/raster.pmtiles
          masks: Layers/GereduceerdeKadaster/masks.geojson
          sprites: Layers/GereduceerdeKadaster/sprites.webp
          spritesIndex: Layers/GereduceerdeKadaster/sprites.json
      - id: GereduceerdeKadaster-toponyms
        name:
          nl: Toponiemen
          en: Toponyms
        kind: searchable
        description:
          nl: |-
            Historische toponiemen zoals ze voorkomen op het gereduceerd kadaster van
            België (1847–1855) voor de provincies Antwerpen en Oost-Vlaanderen.
            Doorzoekbaar en als labels op de kaart weer te geven. Afkomstig uit de Belgian
            Historical Gazetteer (World Historical Gazetteer, dataset 1756); wordt later
            uitgebreid naar de overige Belgische provincies.
          en: |-
            Historical toponyms as they appear on Belgium’s reduced cadastre (1847–1855)
            for the provinces of Antwerp and East Flanders. Searchable and displayable as
            labels on the map. Sourced from the Belgian Historical Gazetteer (World
            Historical Gazetteer, dataset 1756); coverage will later be extended to the
            remaining Belgian provinces.
        sources:
          - citation: Project, B. H. G., & Hermenault, L. (2026). Belgian Historical Gazetteer - Provinces Antwerp and East-Flanders [Data set]. World Historical Gazetteer. https://www.uantwerpen.be/en/projects/belgian-historical-gazetteer/
            url: https://zenodo.org/api/records/21256920/files/Gereduceerd_Kadaster_Toponyms.zip/content
        artifacts:
          toponyms: Layers/GereduceerdeKadaster/toponyms.json
