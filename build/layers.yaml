  - id: Popp
    label: Poppkaart
    timeframe:
      startYear: 1842
      endYear: 1879
    sublayers:
      - id: Popp-wmts
        name:
          nl: Kaart
          en: Map
        kind: wmts
        source:
          type: remote
          url: https://geo.api.vlaanderen.be/HISTCART/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=popp&STYLE=&FORMAT=image/png&TILEMATRIXSET=GoogleMapsVL&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}
        description:
          nl: |-
            De Atlas Cadastral Parcellaire de la Belgique, uitgegeven door de Brugse
            drukker-uitgever Philippe Chrétien Popp (1805–1879) tussen 1842 en 1879. Een
            gecommercialiseerde versie van het officieel kadaster van België, gedrukt via
            lithografie. De atlas omvat meer dan 2.000 kaarten en 30.000 registerbladen en
            dekt zo'n 1.700 Belgische gemeenten. De bijhorende leggers vermelden per
            perceel de eigenaar, de oppervlakte, de bestemming en de belastbare waarde.
            Digitaal raadpleegbaar via geopunt.be en de KBR.
          en: |-
            The Atlas Cadastral Parcellaire de la Belgique, published between 1842 and
            1879 by the Bruges printer and publisher Philippe Chrétien Popp (1805–1879). A
            commercialised version of Belgium’s official cadastre, printed by lithography.
            The atlas comprises more than 2,000 maps and 30,000 register sheets, covering
            approximately 1,700 Belgian municipalities. For each parcel, the accompanying
            registers record the owner, area, land use and taxable value. Available
            digitally via geopunt.be and KBR.
        sources:
          - citation: Popp, P. C. (1860). Atlas cadastral parcellaire de la Belgique [Map]. Koninklijke Bibliotheek van België (KBR). https://www.geopunt.be
            url: https://geo.api.vlaanderen.be/HISTCART/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=popp&STYLE=&FORMAT=image/png&TILEMATRIXSET=GoogleMapsVL&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}
  - id: PrimitiefKadaster
    label: Primitief kadaster
    timeframe:
      startYear: 1808
      endYear: 1834
    sublayers:
      - id: PrimitiefKadaster-iiif
        name:
          nl: Kaart
          en: Map
        kind: iiif
        description:
          nl: |-
            Het 'primitief kadaster' is de eerste systematische inventarisatie van alle
            Belgische percelen, gronden en gebouwen, aangelegd met het oog op een
            rechtvaardige grondbelasting. De opmaak startte omstreeks 1800 onder Frans
            bewind en werd voor het grootste deel van België bekrachtigd in 1834; voor
            Limburg en Luxemburg pas in 1844. De collectie omvat ruim 23.000 kadastrale
            plannen en meer dan 61.000 processen-verbaal van gemeentegrensafpalingen.
            Digitaal raadpleegbaar via het Rijksarchief (search.arch.be) en geografisch
            via cartesius.be.
          en: |-
            The ‘primitive cadastre’ is the first systematic inventory of all Belgian
            parcels, land and buildings, created to establish fair land taxation.
            Compilation began around 1800 under French rule and was officially adopted for
            most of Belgium in 1834; Limburg and Luxembourg followed only in 1844. The
            collection comprises more than 23,000 cadastral plans and over 61,000 reports
            documenting municipal boundary demarcations. Available digitally through the
            State Archives (search.arch.be) and geographically through cartesius.be.
        furtherReading:
          Het primitief kadaster (Rijksarchief): https://search.arch.be/
          Kadasterplannen op Cartesius: https://www.cartesius.be/
          Voorbeeldartikel over het primitief kadaster: https://example.org/primitief-kadaster
        sources:
          - citation: Rijksarchief België. (1834). Primitief kadaster [Map]. Rijksarchief België. https://search.arch.be
            url: https://iiif.ghentcdh.ugent.be/iiif/collections/primitief_kadaster
          - citation: "Ghent Centre for Digital Humanities. (2026). Primitief kadaster: Georeferenced cadastral map-sheet masks [Data set]. Derived from the primitive cadastral plans held by the State Archives of Belgium."
            url: https://zenodo.org/api/records/21256920/files/Primitief_Kadaster_Masks.zip/content
        artifacts:
          geomaps: Layers/PrimitiefKadaster/geomaps.json
          search: Layers/PrimitiefKadaster/search.json
          raster: Layers/PrimitiefKadaster/raster.pmtiles
          masks: Layers/PrimitiefKadaster/masks.geojson
          sprites: Layers/PrimitiefKadaster/sprites.webp
          spritesIndex: Layers/PrimitiefKadaster/sprites.json
      - id: PrimitiefKadaster-parcels
