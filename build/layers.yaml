          nl: |-
            De Villaretkaart (officieel: Carte topographique de la partie de la Belgique
            comprise entre Gand et Tournay, Maestricht et Liège) is de oudste
            grootschalige topografische kaart van een groot deel van het huidige Belgische
            grondgebied. Ze werd opgesteld tussen 1745 en 1748 in opdracht van de Franse
            koning Lodewijk XV. Jean Villaret karteerde het gebied op schaal 1:14.400 in
            meer dan 80 kaartbladen. De originelen liggen in het Institut national de
            l'information géographique et forestière (IGN) in Parijs; als open data
            beschikbaar via geopunt.be.
          en: |-
            The Villaret map (officially: Carte topographique de la partie de la Belgique
            comprise entre Gand et Tournay, Maestricht et Liège) is the oldest large-scale
            topographic map covering a substantial part of present-day Belgium. It was
            produced between 1745 and 1748 by order of the French king Louis XV. Jean
            Villaret mapped the area at a scale of 1:14,400 across more than 80 map
            sheets. The originals are held by the Institut national de l’information
            géographique et forestière (IGN) in Paris; the map is available as open data
            via geopunt.be.
