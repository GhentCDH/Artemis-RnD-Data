            clickable and linked to the corresponding register data.
        sources:
          - citation: Ghent Centre for Digital Humanities. (n.d.). Vectorised primitive cadastre parcels [Data set].
            url: https://zenodo.org/api/records/21256920/files/Primitief_Kadaster_Parcels.zip/content
        artifacts:
          parcels: Layers/PrimitiefKadaster/parcels.pmtiles
      - id: PrimitiefKadaster-toponyms
        name:
          nl: Toponiemen
          en: Toponyms
        kind: searchable
        description:
          nl: |-
            Toponiemen getranscribeerd uit de primitieve kadasterplannen, doorzoekbaar en
            als labels op de kaart weer te geven.
          en: |-
            Toponyms transcribed from the primitive cadastral plans, searchable and
            displayable as labels on the map.
        sources:
          - citation: Rijksarchief België. (1834). Primitief kadaster — getranscribeerde toponiemen [Data set]. Rijksarchief België. https://search.arch.be
            url: https://zenodo.org/api/records/21256920/files/Primitief_Kadaster_Toponyms.zip/content
        artifacts:
          toponyms: Layers/PrimitiefKadaster/toponyms.json
      - id: PrimitiefKadaster-verzamelbladen
        name:
          nl: Verzamelbladen
          en: Index sheets
        kind: iiif
        description:
          nl: Verzamelbladen (overzichtskaarten) uit de IIIF-collectie van het primitief kadaster, apart van de individuele kadastrale plannen.
          en: Index sheets (overview maps) from the primitive cadastre IIIF collection, separated from the individual cadastral plans.
        sources:
          - citation: Rijksarchief België. (1834). Primitief kadaster [Map]. Rijksarchief België. https://search.arch.be
            url: https://iiif.ghentcdh.ugent.be/iiif/collections/primitief_kadaster
          - citation: "Ghent Centre for Digital Humanities. (2026). Primitief kadaster: Georeferenced cadastral map-sheet masks [Data set]. Derived from the primitive cadastral plans held by the State Archives of Belgium."
            url: https://zenodo.org/api/records/21256920/files/Primitief_Kadaster_Masks.zip/content
